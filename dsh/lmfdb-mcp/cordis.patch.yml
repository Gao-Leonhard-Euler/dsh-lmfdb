# Connect the public LMFDB MCP server (read-only LMFDB database access).
# 9 tools: overview / list_tables / search_knowls / describe_table /
# sample_rows / run_sql / count_rows / table_stats / export_query.
# Installed from this directory via:  plugin_manager install_bundle
- insert:
    - id: lmfdb-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: lmfdb
        transport: streamable-http
        url: 'https://mcp.lmfdb.org/mcp'
        # table_stats / export_query on large tables can run for a while
        toolCallTimeoutMs: 300000
        # the endpoint is Google-hosted and its first TCP connect from this
        # network can exceed the 10s client connect timeout, so keep retrying
        # in the background instead of failing the whole bundle
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 1000
          maxDelayMs: 30000
          maxAttempts: 200
